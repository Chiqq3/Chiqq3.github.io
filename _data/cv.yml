- title: Research
  type: time_table
  contents:
    - title: Learning-Based User Association & Mobility Management in mmWave V2X Networks
      institution: The University of Tokyo (Doctoral Research)
      year: 2024 - Present
      description:
        - "<b>Objective:</b> Contextual multi-armed bandit (CMAB) approaches for user association in mmWave vehicular networks under non-stationary channel conditions, without CSI acquisition or offline training"
        - "<b>Key Contributions:</b>"
        - "  • Developed <b>BAND algorithm</b> integrating change-point detection (CUSUM-CD) with blockage-aware reward estimation to overcome detection failure of conventional bandits under mobility- and blockage-driven non-stationary rewards <i>(IEEE GLOBECOM 2026)</i>"
        - "  • Proposed <b>trajectory-aligned knowledge (TAK) regions</b> in a semi-distributed CMAB framework for cross-vehicle knowledge sharing and cold-start acceleration, with rigorous regret-bound analysis <i>(IEEE T-VT, under review)</i>"
        - "  • Developed <b>DCC-SMAB algorithm</b> using dynamic hierarchical context clustering to mitigate slow convergence in high-dimensional context spaces, achieving 61% regret reduction <i>(IEEE VNC 2026)</i>"
        - "  • Built <b>SUMO and ray-tracing simulation</b> framework with real-world maps for realistic V2X communication data analysis <i>(IEICE RCS 2025)</i>"
        - "  • Proposed a <b>geometric-based dynamic V2I blockage modeling</b> and detection method <i>(IEEE VTC 2024)</i>"
        - "<b>Methods:</b> Contextual bandit algorithms, online learning, realistic VANET simulations"

    - title: Blockage-Aware mmWave V2X Connectivity Analysis based on MCM
      institution: Technische Hochschule Ingolstadt, Germany (Visiting Researcher)
      year: 2024 - 2025
      description:
        - "<b>Objective:</b> Enhance RSU-assisted ITS for predictive blockage mitigation using Maneuver Coordination Messages"
        - "<b>Key Contributions:</b>"
        - "  • Proposed <b>FDM-based data structure</b> for advanced V2X service development"
        - "  • Developed <b>MCM-based blockage prediction scheme</b> for V2X performance enhancement"
        - "  • VANET simulation development with <b>Artery core development team</b> (Artery, OMNeT++, SUMO)"

    - title: Measurement and Prediction of Vegetation Attenuation on mmWave
      institution: Tokyo Institute of Technology & Rakuten Mobile Inc. (Master Research)
      year: 2020 - 2022
      description:
        - "<b>Objective:</b> Measure and predict static shadowing effect caused by single tree at 25GHz/28GHz"
        - "<b>Key Contributions:</b>"
        - "  • Designed <b>outdoor measurement</b> for 5G base station (Area tester, Spectrum analyzer)"
        - "  • Developed <b>DKED model</b> (Double knife edge diffraction modeling)"
        - "  • Simulated <b>ITU-R tree fading model</b> using laser scanner data"
        - "  • Built <b>3D measurement environment and tree model</b> in Wireless InSite"
        - "  • Conducted laser scanning, point cloud fusion, ranging, and <b>antenna pattern analysis</b>"


- title: Research
  type: time_table
  contents:
    - title: Learning-Based User Association for Blockage-aware mmWave V2X Networks
      institution: The University of Tokyo (Doctoral Research)
      year: 2024 - Present
      description:
        - "<b>Objective:</b> Address link quality degradation due to blockages in mmWave vehicular networks"
        - "<b>Key Contributions:</b>"
        - "  • Developed <b>DCC-SMAB algorithm</b> achieving 61% regret reduction through dynamic context clustering"
        - "  • Proposed future path sharing framework for <b>mmWave blockage prediction</b>"
        - "  • Integrated <b>SUMO and ray-tracing simulation</b> with real-world maps for V2X environment modeling"
        - "<b>Methods:</b> Contextual bandit algorithm, online learning, realistic VANET simulations"

    - title: Blockage-Aware mmWave V2X Connectivity Analysis based on MCM
      institution: Technische Hochschule Ingolstadt, Germany (Visiting Researcher)
      year: 2024 - 2025
      description:
        - "<b>Objective:</b> Enhance RSU-assisted ITS for predictive blockage mitigation using Maneuver Coordination Messages"
        - "<b>Key Contributions:</b>"
        - "  • Proposed <b>FDM-based data structure</b> for advanced V2X service development"
        - "  • Developed <b>MCM-based blockage prediction scheme</b> for V2X performance enhancement"
        - "  • VANET simulation development with <b>Artery core development team</b> (Artery, OMNeT++, SUMO)"

    - title: Measurement and Prediction of Vegetation Attenuation on mmWave
      institution: Tokyo Institute of Technology & Rakuten Mobile Inc. (Master Research)
      year: 2020 - 2022
      description:
        - "<b>Objective:</b> Measure and predict static shadowing effect caused by single tree at 25GHz/28GHz"
        - "<b>Key Contributions:</b>"
        - "  • Designed <b>outdoor measurement</b> for 5G base station (Area tester, Spectrum analyzer)"
        - "  • Developed <b>DKED model</b> (Double knife edge diffraction modeling)"
        - "  • Simulated <b>ITU-R tree fading model</b> using laser scanner data"
        - "  • Built <b>3D measurement environment and tree model</b> in Wireless InSite"
        - "  • Conducted laser scanning, point cloud fusion, ranging, and <b>antenna pattern analysis</b>"

